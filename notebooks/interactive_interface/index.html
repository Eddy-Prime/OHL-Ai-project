<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OHL Attendance Predictor</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #0d0d1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .chat-container {
        width: 480px;
        background: #1a1a2e;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        background: #003d7a;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .chat-header div h2 {
        color: #fff;
        font-size: 16px;
      }
      .chat-header div p {
        color: #a0c4ff;
        font-size: 12px;
      }

      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        max-height: 440px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      .msg.bot {
        background: #16213e;
        color: #e0e0e0;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
      }
      .msg.user {
        background: #003d7a;
        color: #fff;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
      }

      .chat-input {
        display: flex;
        padding: 14px;
        border-top: 1px solid #2a2a3e;
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 24px;
        border: 1px solid #2a2a3e;
        background: #16213e;
        color: #fff;
        font-size: 14px;
        outline: none;
      }

      .chat-input input::placeholder {
        color: #666;
      }

      .chat-input button {
        background: #003d7a;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 24px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }

      .chat-input button:hover {
        background: #0059b3;
      }

      .typing-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #a0c4ff;
        border-radius: 50%;
        margin: 0 2px;
        animation: bounce 1.2s infinite;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <div>
          <h2>🟡 OHL Attendance Predictor</h2>
          <p>Powered by Machine Learning</p>
        </div>
      </div>

      <div class="chat-messages" id="messages">
        <div class="msg bot">
          👋 Welcome! I can predict attendance for an OH Leuven home match.<br /><br />
          👤 Who is the <b>opponent</b>?
        </div>
      </div>

      <div class="chat-input">
        <input
          type="text"
          id="userInput"
          placeholder="Type your answer..."
          onkeydown="if (event.key === 'Enter') sendMessage();"
        />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      // Reset session on every page load
      window.addEventListener("load", async () => {
        await fetch("/reset", { method: "POST" });
      });

      async function sendMessage() {
        const input = document.getElementById("userInput");
        const msg = input.value.trim();
        if (!msg) return;

        appendMessage(msg, "user");
        input.value = "";
        input.disabled = true;

        const typingId = showTyping();

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
          });
          const data = await res.json();
          removeTyping(typingId);
          appendMessage(data.reply, "bot");
        } catch (err) {
          removeTyping(typingId);
          appendMessage("❌ Something went wrong. Please try again.", "bot");
        }

        input.disabled = false;
        input.focus();
      }

      function appendMessage(text, sender) {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = `msg ${sender}`;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      function showTyping() {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        const id = "typing-" + Date.now();
        div.id = id;
        div.className = "msg bot";
        div.innerHTML =
          '⏳ Thinking... <span class="typing-dots"><span></span><span></span><span></span></span>';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return id;
      }

      function removeTyping(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }
    </script>
  </body>
</html>
